<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none" role="img" aria-label="BladeX Components">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="80" x2="1000" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#18181b"/>
      <stop offset="1" stop-color="#3f3f46"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#18181b" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect x="48" y="48" width="1104" height="324" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" filter="url(#shadow)"/>
  <rect x="88" y="88" width="56" height="56" rx="14" fill="url(#accent)"/>
  <text x="118" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" fill="#fafafa" text-anchor="middle">BX</text>
  <text x="168" y="118" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="700" fill="#18181b" letter-spacing="-0.02em">BladeX Components</text>
  <text x="168" y="158" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#71717a">Laravel Blade primitives · shadcn-style registry · Tailwind v4</text>
  <!-- mock buttons -->
  <rect x="168" y="200" width="108" height="40" rx="8" fill="#18181b"/>
  <text x="222" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#fafafa" text-anchor="middle">Primary</text>
  <rect x="292" y="200" width="108" height="40" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="346" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Outline</text>
  <rect x="416" y="200" width="108" height="40" rx="8" fill="#f4f4f5"/>
  <text x="470" y="225" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600" fill="#18181b" text-anchor="middle">Secondary</text>
  <!-- mock input -->
  <rect x="168" y="268" width="420" height="44" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
  <text x="188" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#a1a1aa">you@example.com</text>
  <!-- code chip -->
  <rect x="620" y="200" width="492" height="112" rx="12" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <text x="644" y="232" font-family="ui-monospace, monospace" font-size="13" fill="#71717a">php artisan bladex-components:add</text>
  <text x="644" y="262" font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#18181b">input button select</text>
  <text x="644" y="292" font-family="ui-monospace, monospace" font-size="13" fill="#71717a">&lt;x-ui::button variant="primary" /&gt;</text>
</svg>
